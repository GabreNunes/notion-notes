<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Cloud Notes</title>
  <style>
    :root {
      --bg-primary: #191919;
      --bg-sidebar: #202020;
      --bg-hover: #2c2c2c;
      --text-main: #d4d4d4;
      --text-muted: #787774;
      --accent-color: #2eaadc;
      --border-color: #2f2f2f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Tela de Login */
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .btn-login {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    /* App Layout */
    #app { display: flex; width: 100vw; height: 100vh; }
    
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .user-profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
      font-size: 14px;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
    }
    .btn-action:hover { background: var(--bg-hover); color: var(--text-main); }

    .page-list { list-style: none; flex: 1; overflow-y: auto; }
    .page-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .page-item.active, .page-item:hover { background: var(--bg-hover); color: var(--text-main); }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 40px 100px;
    }

    .doc-title {
      font-size: 36px;
      font-weight: 700;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      width: 100%;
      margin-bottom: 24px;
    }

    .editor {
      min-height: 400px;
      outline: none;
      font-size: 16px;
      line-height: 1.6;
    }

    .status-bar {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
    }
  </style>

  <!-- Firebase SDKs via CDN (Pronto para rodar direto no navegador) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Suas chaves reais do projeto do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyD0I2VjAagIbQF2EbiOcae9DJsPdZ0fU-Q",
    authDomain: "meus-estudos-notion.firebaseapp.com",
    projectId: "meus-estudos-notion",
    storageBucket: "meus-estudos-notion.firebasestorage.app",
    messagingSenderId: "1009187894623",
    appId: "1:1009187894623:web:871ec71e823806e850f2ea",
    measurementId: "G-QC5J02CCC3"
  };

  // Inicializa o Firebase e os Serviços
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let activePageId = null;
  let saveTimeout = null;

  // Mapeamento dos elementos da tela
  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userNameSpan = document.getElementById('user-name');
  const pageListEl = document.getElementById('page-list');
  const newPageBtn = document.getElementById('new-page-btn');
  const docTitleEl = document.getElementById('doc-title');
  const editorEl = document.getElementById('editor');
  const statusEl = document.getElementById('status');

  // Eventos de Autenticação
  loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      userNameSpan.textContent = user.displayName || user.email;
      loginScreen.style.display = 'none';
      appScreen.style.display = 'flex';
      loadUserPages();
    } else {
      currentUser = null;
      loginScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });

  // Carrega e sincroniza as páginas do usuário em tempo real
  function loadUserPages() {
    const q = query(collection(db, "pages"), where("userId", "==", currentUser.uid));
    onSnapshot(q, (snapshot) => {
      pageListEl.innerHTML = '';
      let pages = [];
      snapshot.forEach((docSnap) => {
        pages.push({ id: docSnap.id, ...docSnap.data() });
      });

      pages.forEach((p) => {
        const li = document.createElement('li');
        li.className = `page-item ${p.id === activePageId ? 'active' : ''}`;
        li.innerHTML = `<span>📄 ${p.title || 'Sem título'}</span>`;
        li.onclick = () => selectPage(p);
        pageListEl.appendChild(li);
      });

      if (!activePageId && pages.length > 0) {
        selectPage(pages[0]);
      } else if (pages.length === 0) {
        createNewPage();
      }
    });
  }

  // Criar nova nota no Firestore
  newPageBtn.addEventListener('click', createNewPage);
  async function createNewPage() {
    const pageRef = doc(collection(db, "pages"));
    const newPage = {
      title: "Nova Anotação",
      content: "<p>Comece a digitar suas anotações aqui...</p>",
      userId: currentUser.uid,
      updatedAt: new Date()
    };
    await setDoc(pageRef, newPage);
    selectPage({ id: pageRef.id, ...newPage });
  }

  // Selecionar nota ativa
  function selectPage(page) {
    activePageId = page.id;
    docTitleEl.value = page.title;
    editorEl.innerHTML = page.content;
    statusEl.textContent = "Sincronizado na nuvem";
  }

  // Salvamento automático na nuvem enquanto digita
  function triggerAutoSave() {
    statusEl.textContent = "Salvando na nuvem...";
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
      if (!activePageId) return;
      await setDoc(doc(db, "pages", activePageId), {
        title: docTitleEl.value,
        content: editorEl.innerHTML,
        userId: currentUser.uid,
        updatedAt: new Date()
      }, { merge: true });
      statusEl.textContent = "Salvo na nuvem!";
    }, 1000);
  }

  docTitleEl.addEventListener('input', triggerAutoSave);
  editorEl.addEventListener('input', triggerAutoSave);
</script>
</head>
<body>

  <!-- Tela de Login -->
  <div id="login-screen">
    <h2>Notion Cloud Notes</h2>
    <p style="color: #787774; margin-top: 8px;">Acesse suas anotações de qualquer computador ou celular</p>
    <button class="btn-login" id="login-btn">
      🔑 Entrar com Google
    </button>
  </div>

  <!-- Tela do App -->
  <div id="app" style="display: none;">
    <aside class="sidebar">
      <div class="user-profile">
        <span id="user-name">Usuário</span>
        <button id="logout-btn" style="background:none; border:none; color:#787774; cursor:pointer;">Sair</button>
      </div>
      <button class="btn-action" id="new-page-btn">+ Nova Página</button>
      <ul class="page-list" id="page-list"></ul>
    </aside>

    <main class="main-content">
      <input type="text" id="doc-title" class="doc-title" placeholder="Título da aula ou matéria..." />
      <div id="editor" class="editor" contenteditable="true"></div>
      <div id="status" class="status-bar">Conectando...</div>
    </main>
  </div>

</body>
</html>
